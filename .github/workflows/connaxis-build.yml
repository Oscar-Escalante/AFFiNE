name: Build & Deploy Connaxis Wiki

on:
  push:
    branches: [canary]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-native:
    name: Build Rust server-native (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install server-native deps
        run: yarn workspaces focus @affine/server-native
        env:
          HUSKY: '0'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          SENTRYCLI_SKIP_DOWNLOAD: '1'

      - name: Setup Rust 1.96.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-server-native

      - name: Install clang
        run: sudo apt-get install -y clang

      - name: Build server-native
        run: yarn workspace @affine/server-native build --target x86_64-unknown-linux-gnu
        env:
          CC: clang -D_BSD_SOURCE
          TARGET_CC: clang -D_BSD_SOURCE

      - name: Rename artifact
        run: mv packages/backend/native/server-native.node packages/backend/native/server-native.x64.node

      - name: Upload server-native
        uses: actions/upload-artifact@v4
        with:
          name: server-native-x64
          path: packages/backend/native/server-native.x64.node
          if-no-files-found: error

  build-frontend:
    name: Build web + admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        env:
          HUSKY: '0'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          SENTRYCLI_SKIP_DOWNLOAD: '1'

      - name: Set version
        run: ./scripts/set-version.sh 0.0.0-connaxis

      - name: Build web
        run: yarn workspace @affine/web build
        env:
          BUILD_TYPE: stable

      - name: Build admin
        run: yarn workspace @affine/admin build
        env:
          BUILD_TYPE: stable

      - name: Upload web
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: packages/frontend/apps/web/dist
          if-no-files-found: error

      - name: Upload admin
        uses: actions/upload-artifact@v4
        with:
          name: admin
          path: packages/frontend/admin/dist
          if-no-files-found: error

  build-server:
    name: Build TypeScript server
    runs-on: ubuntu-latest
    needs: [build-native]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Download server-native
        uses: actions/download-artifact@v4
        with:
          name: server-native-x64
          path: packages/backend/native

      - name: Install server deps
        run: yarn workspaces focus @affine/server
        env:
          HUSKY: '0'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          SENTRYCLI_SKIP_DOWNLOAD: '1'

      - name: Set version
        run: ./scripts/set-version.sh 0.0.0-connaxis

      - name: Build server
        run: yarn workspace @affine/server build

      - name: Upload server dist
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: packages/backend/server/dist
          if-no-files-found: error

  build-and-push:
    name: Docker image → GHCR
    runs-on: ubuntu-latest
    needs: [build-frontend, build-server]
    steps:
      - uses: actions/checkout@v4

      - name: Download web
        uses: actions/download-artifact@v4
        with:
          name: web
          path: packages/frontend/apps/web/dist

      - name: Download admin
        uses: actions/download-artifact@v4
        with:
          name: admin
          path: packages/frontend/admin/dist

      - name: Download server dist
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: packages/backend/server/dist

      - name: Download server-native
        uses: actions/download-artifact@v4
        with:
          name: server-native-x64
          path: packages/backend/native

      - name: Create empty mobile dist (not needed for web-only)
        run: mkdir -p packages/frontend/apps/mobile/dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install production deps
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production
        env:
          HUSKY: '0'

      - name: Generate Prisma client
        run: yarn workspace @affine/server prisma generate

      - name: Move node_modules into server package
        run: mv ./node_modules ./packages/backend/server/

      - name: Set version
        run: ./scripts/set-version.sh 0.0.0-connaxis

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          file: .github/deployment/node/Dockerfile
          tags: ghcr.io/oscar-escalante/connaxis-wiki:canary
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Pull & restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: apps.connaxis.com
          port: 22666
          username: sshadmin
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /home/sshadmin/apps/affine
            docker pull ghcr.io/oscar-escalante/connaxis-wiki:canary
            docker compose up -d affine
            docker image prune -f
